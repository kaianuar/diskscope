# omp-agent pipeline — modelRoles for the PIPELINE loop.
# Validated live (2026-08-15) against working providers.
# Builder + critic MUST differ → genuine cross-model adversarial review.

# BUILDER / default — Xiaomi MiMo pro (VALIDATED working coder).
modelRoles:
  default: xiaomi-token-plan-sgp/mimo-v2.5-pro   # builder / implementation ✅ verified
  plan: xiaomi-token-plan-sgp/mimo-v2.5          # planning (verified)
  smol: xiaomi-token-plan-sgp/mimo-v2.5-pro       # quick tasks

# CRITIC / adversarial review (Gate 2) — VALIDATED on OpenRouter.
#   z-ai/glm-5.2  (cheap ~$0.49/M in, top model from Kai's validated pool,
#                  INDEPENDENT from the MiMo builder = real cross-model review)
#   NOTE: glm-5.2 is a reasoning model — the critic call MUST use a generous
#   max_tokens (>=4000) or it truncates and returns empty.
critical:
  critic: "z-ai/glm-5.2"

# How the critic is invoked (set in tests/review_gate.sh):
#   provider=openrouter  model=z-ai/glm-5.2  max_tokens=4000
