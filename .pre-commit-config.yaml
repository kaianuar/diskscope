# .pre-commit-config.yaml
# Pre-commit hooks for code quality enforcement
# Install: pip install pre-commit && pre-commit install

repos:
  # Ruff - Fast Python linter (replaces flake8, black, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Prettier - Code formatter for JS/TS/JSON/Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.2.5
    hooks:
      - id: prettier
        types_or: [javascript, typescript, tsx, json, yaml, markdown, css, html]
        args: [--write, --prose-wrap=always]

  # mypy - Static type checker for Python
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-urllib3]
        args: [--strict, --show-error-codes]

  # TypeScript / tsc type checking
  - repo: local
    hooks:
      - id: tsc-check
        name: TypeScript type check
        entry: npx tsc --noEmit
        language: system
        types: [typescript]
        pass_filenames: false

  # Conventional commit message validation
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # No debug statements in production
  - repo: local
    hooks:
      - id: no-console-log
        name: No console.log/debugger in production code
        entry: grep -r "console\.(log|debug|info|warn|error)" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build .
        language: system
        stages: [commit]
        verbose: true

      - id: no-debugger
        name: No debugger statements
        entry: grep -r "debugger" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=dist .
        language: system
        stages: [commit]
        verbose: true

  # No TODO/FIXME in committed code (optional - comment out if too strict)
  # - repo: local
  #   hooks:
  #     - id: no-todo
  #       name: No TODO/FIXME comments
  #       entry: grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=dist .
  #       language: system
  #       stages: [commit]

default_stages: [commit]
default_install_hook_types: [commit, commit-msg]