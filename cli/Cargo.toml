[package]
name = "diskscope-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DiskScope command-line interface: scan, summarize, and safely trash files."

[[bin]]
name = "diskscope"
path = "src/main.rs"

[dependencies]
domain = { path = "../domain" }
scan-engine = { path = "../scan-engine" }
clap = { version = "=4.5.61", features = ["derive"] }
clap_complete = "=4.5.61"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1.0"
tempfile = "3.27"
trash = { version = "5.2", default-features = false }

[lints]
workspace = true
