[package]
name = "diskscope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "diskscope"
path = "src/main.rs"

[dependencies]
scan-engine = { path = "../scan-engine" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
serde_json = "1"
