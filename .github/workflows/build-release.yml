name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            bundles: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            bundles: ""
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            bundles: ""
          - platform: windows-latest
            args: ""
            # MSI (WiX) requires a numeric ProductVersion, so prerelease
            # versions (0.2.0-alpha.1) cannot produce an MSI. NSIS accepts
            # any version string.
            bundles: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend deps
        working-directory: gui/web
        run: npm ci || npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2 --locked

      - name: Build GUI bundle
        working-directory: gui
        run: cargo tauri build ${{ matrix.args }} ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diskscope-${{ matrix.platform }}-${{ matrix.args || 'default' }}
          # Cross-target builds (macOS) emit bundles under
          # target/<triple>/release/bundle/; host builds use
          # target/release/bundle/. Match both.
          path: |
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI release
        run: cargo build --release -p diskscope-cli --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: diskscope-cli-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/diskscope${{ matrix.ext }}
          if-no-files-found: ignore

  release:
    needs: [build-gui, build-cli]
    runs-on: ubuntu-latest
    # Run even if a platform leg failed, as long as the workflow wasn't
    # cancelled — the release uses whatever artifacts exist.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Fail if no artifacts were produced
        run: |
          count=$(find artifacts -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no build artifacts were produced; refusing to create an empty release" >&2
            exit 1
          fi
          echo "found $count artifact(s)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          # Prerelease tags (e.g. v0.2.0-alpha.1) produce prerelease
          # releases rather than full releases.
          prerelease: startsWith(github.ref_name, 'v') && contains(github.ref_name, '-')
