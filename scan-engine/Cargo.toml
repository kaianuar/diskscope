[package]
name = "scan-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DiskScope scan engine adapter: parallel filesystem walk, incremental caching, safe delete, filtering, sorting, and output formatting."

[lib]
name = "scan_engine"
path = "src/lib.rs"

[dependencies]
domain = { path = "../domain" }

# Parallel filesystem walk
jwalk = "0.9"
rayon = "1.12"
walkdir = "2.5"

# .gitignore-aware walking
ignore = "0.4"

# Embedded cache
redb = "4.2"

# Cross-platform move-to-trash. Use default features — the crate's defaults
# (coinit_apartmentthreaded + chrono) enable `os_limited` on all platforms.
trash = "5.2"

# Serialization for JSON output formats only
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Interior mutability primitives
parking_lot = "0.12"

# Real-time sync across devices (Phase 5). Optional: the offline-first build
# never links it. `ably` is a REST-only client, so sync publishes/receives
# file events via channel history rather than a realtime socket.
ably = { version = "0.2", optional = true }

[features]
# Cross-device scan-result sync via Ably. Off by default.
sync = ["dep:ably"]

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
